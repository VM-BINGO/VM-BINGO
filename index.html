<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VM Bingo</title>
<style>
body { font-family: Arial, sans-serif; margin:20px; }
input, button { padding:6px; margin:4px; }
button { cursor:pointer; }
.spil { border:1px solid #ccc; padding:10px; border-radius: 8px; margin:10px 0; }

#pladerVisning {
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* mobil: 2 kolonner */
  gap: 10px;
}
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 9999;
}

.modal-content {
  background: #fff;
  max-width: 360px;
  margin: 15vh auto;
  padding: 20px;
  border-radius: 8px;
  text-align: center;
}

.modal-buttons {
  margin-top: 15px;
  display: flex;
  justify-content: space-between;
}

.modal-buttons button {
  padding: 8px 14px;
}

.modal-buttons .primary {
  background: #1976d2;
  color: white;
  border: none;
}

.plade {
  border:1px solid #999;
  padding:6px;
  border-radius: 3px;
  margin:0;
  width:100%;
  box-sizing: border-box;
}

.plade h4 { margin:4px 0; }

.grid {
  display:grid;
  grid-template-columns: repeat(5,1fr);
  gap:4px;
  text-align:center;
}

.hit { background:#b6f3b6; }

.result-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 4px 4px 4px 0;
  padding: 2px 6px;        /* 👈 mindre højde */
  border: 2px solid #888;
  border-radius: 6px;
  background: #fff8cc;
  font-weight: bold;
  white-space: nowrap;
  min-width: 52px;
  line-height: 1.2;       /* 👈 strammere tekst */
  justify-content: space-between;
}

.result-chip button {
  border: none;
  background: #fff8cc;
  cursor: pointer;
  font-size: 14px;   /* 👈 mindre X */
  line-height: 1;
  color: crimson;
  padding: 0;
}

.solgt {
  background: #fff8cc;
  border-color: #888;
}

input {
  width: 100%;
  box-sizing: border-box;
  margin: 4px 0;   /* 👈 kun top/bund, ikke venstre/højre */
  padding: 6px;
}
.opret-spil {
  display: grid;
  grid-template-columns: repeat(3, 160px);
  gap: 10px;
  align-items: end;
}

.opret-spil > div {
  width: 100%;
}

.opret-spil select,
.opret-spil input {
  width: 100%;
  height: 34px;   /* samme højde */
  box-sizing: border-box;
}

/* Antal plader under Spilnummer – i venstre side */
.antal-plader {
  grid-column: 3;
}

.info-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid #555;
  color: #FF0000;
  font-weight: bold;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  user-select: none;
}

.info-icon:hover {
  background: #f0f0f0;
  color: #000;
  border-color: #000;
}
.fuldt-solgt {
  background: #d9f7d9;   /* lys grøn */
  border-color: #6bbf6b;
}

.til-salg {
  background: #fff8cc;   /* lys gul – samme stil som andre */
  border-color: #888;
}
.udsolgt-badge {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 6px;
  font-size: 12px;
  font-weight: bold;
  background: #6bbf6b;
  color: white;
  border-radius: 4px;
}
.sms-sendt {
  background: #eaf4ff;
  border-color: #7db7ff;
  color: #1a4fa3;
  font-weight: bold;
}
#resultatListe {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 8px;
}
#resultatTitel {
  white-space: nowrap;   /* altid én linje */
  margin: 12px 0 6px 0;
}

/* 📲 Tablet */
@media (min-width: 700px) {
  #pladerVisning {
    grid-template-columns: repeat(5, 1fr);
  }
}

/* Mobil: én kolonne */
@media (max-width: 600px) {
  .opret-spil {
    grid-template-columns: 1fr;
  }
  .antal-plader {
    grid-column: 1;
  }
}

/* 🖥️ Stor skærm */
@media (min-width: 1100px) {
  #pladerVisning {
    grid-template-columns: repeat(6, 1fr);
  }
}

/* 📱 Mobil generelt */
@media (max-width: 600px) {
  #resultatListe {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;

  width: 100%;
  box-sizing: border-box;   /* 👈 VIGTIG */
}


  .resultat {
    font-size: 14px;        /* mindre tekst */
    padding: 6px 4px;      /* mindre padding */
    border-radius: 8px;
  }

  .resultat .fjern {
    font-size: 14px;       /* X lidt mindre */
    margin-left: 4px;
  }
}

@media (max-width: 600px) {
  .tilbage-btn {
  width: 44px;
  height: 44px;
  padding: 0;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  font-size: 18px;
  line-height: 1;        /* 👈 vigtigt */
}
.tilbage-btn:active {
  transform: scale(0.95);
}

}
@media (max-width: 600px) {
  #salgsKnapper {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;   /* én knap pr. række */
    gap: 10px;                    /* luft mellem knapper */
  }

  #salgsKnapper button {
    width: 100%;
    padding: 14px 0;              /* større trykflade */
    font-size: 18px;
  }
}

@media (max-width: 600px) {
  .tilbage-btn {
    font-size: 14px;
    padding: 4px 8px;
  }

  .grid {
    font-size: 14px;
  }

  input {
    width: 100%;
    box-sizing: border-box;
  }

  button {
    width: 100%;
    margin: 6px 0;
  }

  .spil button {
    width: auto;
    margin-right: 6px;
  }
}
.sendt {
  background: #eaf4ff;      /* lys pastel blå */
  border-color: #7db7ff;
}

.sms-sendt-label {
  margin: 4px 0;
  font-weight: bold;
  color: #2b6cb0;
}
.lukket-spil {
  background: #f0f0f0;
  color: #999;
  opacity: 0.7;
  }

.lukket-spil .lukket-badge {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 6px;
  font-size: 12px;
  background: #ccc;
  color: #555;
  border-radius: 4px;
}
.kamp-boks {
  background: #D3D3D3;
  border: 1px solid #000000;
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 16px;
}

.kamp-boks h2 {
  margin-top: 0;
}

.kamp-boks input {
  margin-right: 6px;
}
#pladerVisning {
  margin-bottom: 16px;
}
#salgsKnapper button {
  margin-right: 6px;
}
.spil-boks {
  background: #D3D3D3;      /* en anelse lysere */
  border: 1px solid #000000;
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 16px;

}
#spilSektion {
  background: #D3D3D3;          /* lys grå */
  border: 1px solid #000000;
  border-radius: 6px;
  padding: 16px;
  margin-bottom: 16px;
}
#spilSektion h2,
#spilSektion h3,
.kamp-boks h2,
.kamp-boks h3 {
  margin-top: 0;
}
#salgsKnapper {
  margin-bottom: 20px; /* giver luft ned til næste sektion */
}
#spilSektion h3 {
  margin-top: 20px;
}
.spil-header {
  display: flex;
  align-items: center;
  gap: 12px;     /* afstand mellem knap og tekst */
}

.spil-header h2 {
  margin: 0;     /* fjerner default top/bund-margin */
}

.tilbage-btn {
  padding: 6px 10px;
}
@media (max-width: 600px) {
  #salgsKnapper button {
    width: auto;
    display: inline-block;
  }
}
.salgs-boks {
  background: #fff8cc;          /* lidt lysere end spilSektion */
  border: 1px solid #999;
  border-radius: 6px;
  padding: 12px;
  margin: 12px 0 20px 0;        /* luft over og under */
}
@media (max-width: 600px) {
  button[onclick="sendStatusSmsTilAlle()"] {
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 17px;
  }
}
.primary-btn {
  min-height: 44px;
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 18px;
}
.vis-flere-chip {
  justify-content: center;
  background: #f0f0f0;          /* #fff8cc = Lys gul// #D3D3D3 = mørk grå //#f0f0f0 lys grå til knapper */
  border: 1px solid #000000;
  border-radius: 6px;
  padding: 16px;
  margin-bottom: 16px;
}

.vis-flere-chip:hover {

}

</style>

<h1 style="display:flex; align-items:center; justify-content:space-between; width:100%;">

</h1>

</div>

    </span>
  </h2>

  <input
    id="nytResultat"
    placeholder="Fx 2-1"
    pattern="\d+-\d+"
    title="Format: tal-tal, fx 2-1"
  >

   <button onclick="tilføjResultat()" class="primary-btn">Tilføj</button>

  <!-- ✅ NY: fast overskrift på én linje -->
  <h3 id="resultatTitel">Indtastede resultater</h3>

  <!-- ✅ Resultater kommer ALTID nedenunder -->
  <div id="resultatListe"></div>
<span
  id="visFlereBtn"
  class="result-chip vis-flere-chip"
  onclick="visFlereResultater()"
  style="display:none; cursor:pointer;"
>
  Vis flere resultater
</span>

</div>



<div id="spilSektion" style="display:none;">
  <div class="spil-header">
  <button onclick="lukSpil()" class="tilbage-btn">⬅</button>
  <h2 id="aktivtSpilNavn"></h2>
</div>

<div class="salgs-boks">
  <h3>Sælg plader</h3>

  <div id="salgsKnapper">
    <button onclick="sælgPlader(1)">1</button>
    <button onclick="sælgPlader(2)">2</button>
    <button onclick="sælgPlader(3)">3</button>
    <button onclick="sælgPlader(4)">4</button>
    <button onclick="sælgPlader(5)">5</button>
  </div>
</div>


  <h3>🏆 Tættest på fuld plade</h3>
  
  <div id="tættest"></div>

  <button onclick="sendStatusSmsTilAlle()">
    📊 Send daglig status til alle via SMS
  </button>

  <!-- 🏆 SMS til vinderen -->
  <div id="smsVinder" style="margin:10px 0;"></div>

  <div id="smsAlle" style="margin:10px 0;"></div>

  <h3>Plader</h3>
  <div id="pladerVisning"></div>
</div>

<div class="kamp-boks">
  <h2 style="display:flex; align-items:center; justify-content:space-between; margin-top:0;">
    <span>➕ Opret nyt spil</span>
    <span class="info-icon" onclick="visPladeInfo()">i</span>
  </h2>


<div class="opret-spil">

  <div>
    <div><b>Spilnavn</b></div>
    <input id="spilNavn" placeholder="Fx VM TEAM 10">
  </div>

  <div>
    <div><b>Pris (kr)</b></div>
    <input id="spilPris" placeholder="Fx 10">
  </div>

  <div>
    <div><b>Spilnummer</b></div>
    <input id="spilNr" placeholder="Fx 2">
  </div>

  <div>
    <div><b>Gevinstrate (%)</b></div>
    <input id="gevinstrate" placeholder="Fx 90" value="95">
  </div>

  <div class="antal-plader">
    <div><b>Antal plader</b></div>
    <input value="200" disabled>
</div>


  <div>
    <div>&nbsp;</div>
    <button onclick="opretSpil()" class="primary-btn">Opret spil</button>
  </div>

</div>
<div id="smsModal" class="modal">
  <div class="modal-content">
    <h3>📱 Send SMS til køber</h3>
    <p id="smsModalText"></p>

    <div class="modal-buttons">
      <button onclick="lukSmsModal()">Annuller</button>
      <button class="primary" onclick="åbnSms()">Åbn SMS</button>
    </div>
  </div>
</div>

// --------- RESULTATER ----------
function tilføjResultat(){
  if(aktivtSpil?.lukket){
    alert("Dette spil er lukket – der er fundet en vinder 🏁");
    return;
  }
  const r = nytResultat.value.trim();
  // tjek format: et eller to tal, bindestreg, et eller to tal
if(!/^\d{1,2}-\d{1,2}$/.test(r)){
  alert("Resultatet skal være i formatet tal-tal, fx 2-1. Der skal være bindestreg imellem tallene");
  return;
}

  if(!r) return;
  globaleResultater.push(r);
  nytResultat.value="";
  gem();
  visResultatListe();
  opdaterAlleSpil();
}

function fjernResultat(i){
  globaleResultater.splice(i,1);
  gem();
  visResultatListe();
  opdaterAlleSpil();
}
function visResultatListe(){
  let html = "";

  // Tag de nyeste visteResultater
  const synlige = globaleResultater
    .slice(-visteResultater)   // de seneste
    .reverse();                // nyeste først

  synlige.forEach((r, i) => {
    // beregn korrekt index ift. originale array
    const rigtigIndex = globaleResultater.length - 1 - i;

    html += `
      <span class="result-chip">
        ${r}
        <button onclick="fjernResultat(${rigtigIndex})">❌</button>
      </span>
    `;
  });

  resultatListe.innerHTML = html;

  // Vis/skjul "Vis flere"
  const visFlereBtn = document.getElementById("visFlereBtn");
  visFlereBtn.style.display =
    globaleResultater.length > visteResultater ? "block" : "none";
}



// --------- SPIL ----------
function opretSpil(){
  const navn = spilNavn.value.trim();
  const pris = spilPris.value.trim();
  const rate = Number(gevinstrate.value) || 95;

  if(rate <= 0 || rate > 100){
    alert("Gevinstrate skal være mellem 1 og 100");
    return;
  }

  const nr = spilNr.value.trim();
  const antal = 100;

  if(!navn || !nr){
    alert("Udfyld navn og spilnummer");
    return;
  }
  if(spil[nr]){
    alert("Spilnummer findes allerede!");
    return;
  }

 const allePlader = PLATES_200;

// lav en tilfældig rækkefølge af de 200 plader
const pladeRækkefølge = Object.keys(allePlader)
  .sort(() => Math.random() - 0.5);

spil[nr] = {
  navn,
  pris,
  nr,
  antal: 200,
  rate,

  allePlader,           // alle mulige plader
  pladeRækkefølge,      // 👈 tilfældig rækkefølge
  næstePladeIndex: 0,   // 👈 tæller

  plader: {},           // 👈 starter tom
  købere: {},
  resultater: [...globaleResultater]
};

  gem();
  visAktiveSpil();
}

function visAktiveSpil(){
  const div = document.getElementById("aktiveSpil");
  if(!div) return;

  div.innerHTML = "";

  Object.entries(spil).forEach(([nr, s])=>{
    const lukket = s.lukket === true;

    const totalPlader = s.antal; // altid 200

    const solgte = Object.values(s.købere || {}).filter(k =>
      (k.navn && k.navn.trim() !== "") || (k.tlf && k.tlf.trim() !== "")
    ).length;

    const pris = Number(s.pris || 0);
    const pulje = pris * solgte * (s.rate / 100);
    const puljeVisning = pulje.toFixed(2);

    const el = document.createElement("div");

    const statusKlasse = solgte >= totalPlader ? "fuldt-solgt" : "til-salg";
    el.className = `spil ${statusKlasse}` + (lukket ? " lukket-spil" : "");


    el.innerHTML = `
      <strong>${s.navn} (Spil ${nr})</strong><br>
      <small>
        ${totalPlader} plader – ${solgte} solgt<br>
       💵 Pris: ${pris} kr. • 💰 Pulje: ${puljeVisning} kr. • Gevinstrate: ${s.rate} %
      </small><br>


      ${lukket 
        ? '<span class="lukket-badge">LUKKET</span>' 
        : (solgte >= totalPlader ? '<span class="udsolgt-badge">UDSOLGT</span>' : '')
      }
      ${lukket 
        ? `
            <button onclick="event.stopPropagation(); genåbnSpil('${nr}')">Genåbn</button>
            <button onclick="event.stopPropagation(); bekræftSletSpil('${nr}')">🗑️ Slet</button>
          `
        : `
            <button onclick="event.stopPropagation(); åbnSpil('${nr}')">Åbn</button>
            <button onclick="event.stopPropagation(); lukSpil('${nr}')">Luk spil</button>
            <button onclick="event.stopPropagation(); bekræftSletSpil('${nr}')">🗑️ Slet</button>
          `
      }

    `;

    if(!lukket){
      el.onclick = () => åbnSpil(nr);
    }

    div.appendChild(el);
  });
}

function lukSpil(nr){
  const s = spil[nr];
  if(!s) return;

  if(!confirm(`Vil du lukke spil "${s.navn}"?`)) return;

  s.lukket = true;
  gem();
  visAktiveSpil();

  alert("Spillet er nu lukket 🔒");
}


function bekræftSletSpil(nr){
  const s = spil[nr];
  if(!s) return;

  const ok = confirm(
    `Er du sikker på, at du vil SLETTE dette spil?\n\n` +
    `Navn: ${s.navn}\n` +
    `Spilnr: ${s.nr}\n` +
    `Plader: ${s.antal}\n\n` +
    `Denne handling kan ikke fortrydes!`
  );

  if(!ok) return;

  const input = prompt(
    `For at bekræfte, skriv spilnummeret (${s.nr}) igen:`
  );

  if(input !== String(s.nr)){
    alert("Spilnummer matchede ikke – sletning annulleret.");
    return;
  }

  delete spil[nr];
  gem();
  visAktiveSpil();

  if(aktivtSpil && aktivtSpil.nr == nr){
    aktivtSpil = null;
    spilSektion.style.display = "none";
  }

  alert("Spillet er nu slettet ❌");
}

function genåbnSpil(nr){
  const s = spil[nr];
  if(!s) return;

  if(!confirm(`Vil du genåbne spil "${s.navn}"?`)) return;

  s.lukket = false;

  // nulstil bingo-flag på alle plader
  Object.values(s.købere || {}).forEach(k => {
    k.bingo = false;
  });

  gem();
  visAktiveSpil();

  alert("Spillet er nu genåbnet 🔓");
}

  for(let i = 0; i < antal; i++){

    }

  }

  gem();

  if(solgtePlader.length){
  pendingSmsLink = sendSamletSms(navn, tlf, solgtePlader);
visSmsModal(navn, tlf, solgtePlader.length);

    }
  });
}
}
function sendSamletSms(navn, tlf, pladeNumre){
  let tekst =
    `VM Bingo ⚽\n\n` +
    `Spil: ${aktivtSpil.navn}\n` +
    `Spil nr: ${aktivtSpil.nr}\n\n`;

  pladeNumre.forEach(nr => {
    const felter = aktivtSpil.plader[nr];

    tekst += `Plade ${nr}\n`;

    for(let i = 0; i < felter.length; i += 5){
      tekst += felter
        .slice(i, i + 5)
        .map(v => `[ ${v} ]`)
        .join(" ") + "\n";
    }

    tekst += "\n";
  });

  tekst += "Held og lykke! ⚽";

  const smsBody = encodeURIComponent(tekst);

  // ⛔ ÅBN IKKE SMS HER
  // ✅ RETURNÉR LINKET
  return `sms:${tlf}?body=${smsBody}`;
}

function genererNæstePlade(spilObj){
  if(!spilObj.pladeRækkefølge){
    console.error("pladeRækkefølge mangler på spillet");
    return null;
  }

  if(spilObj.næstePladeIndex >= spilObj.pladeRækkefølge.length){
    return null; // ingen flere plader
  }

  const pladeNr = spilObj.pladeRækkefølge[spilObj.næstePladeIndex];
  spilObj.næstePladeIndex++;

  spilObj.plader[pladeNr] = spilObj.allePlader[pladeNr];
  return pladeNr;
}


function gemKøber(nr, navn, tlf){
  if(!aktivtSpil.købere[nr])
    aktivtSpil.købere[nr] = {navn:"", tlf:""};

  const før = (aktivtSpil.købere[nr].tlf || "").replace(/\D/g,'').length;

  if(navn !== null) aktivtSpil.købere[nr].navn = navn;
  if(tlf !== null) aktivtSpil.købere[nr].tlf = tlf;

  const efter = (aktivtSpil.købere[nr].tlf || "").replace(/\D/g,'').length;

  gem();

  // 🔁 Opdatér kun plader når det er nødvendigt
  if (
    navn !== null ||                      // navn ændret → solgt-farve
    (før < 8 && efter >= 8) ||            // SMS-knap skal vises
    (før >= 8 && efter < 8)               // SMS-knap skal skjules
  ) {
    visPlader();
  }

  visTættest();
}

function visTættest(){
  if(!aktivtSpil) return;

  const top = hentAktivePladerSorteret().slice(0,5);

  tættest.innerHTML = top.length
    ? top.map(
        p => `Plade ${p.nr} – ${p.navn} – ${p.hits}/15`
      ).join("<br>")
    : "Ingen tildelte plader endnu";
}
function hentAktivePladerSorteret(){
  return Object.entries(aktivtSpil.plader)

    // kun aktive (solgte) plader
    .filter(([nr]) => {
      const k = aktivtSpil.købere[nr];
      return k && (k.navn.trim() !== "" || k.tlf.trim() !== "");
    })

    .map(([nr, felter]) => {
      const markerede = beregnMarkeredeFelter(felter, globaleResultater);
      const hits = markerede.filter(o => o.ramt).length;

      const køber = aktivtSpil.købere[nr];
      const navn = køber.navn.trim() !== ""
        ? køber.navn.trim()
        : "(ukendt)";

      return { nr, felter, hits, navn };
    })

    .sort((a, b) => b.hits - a.hits);
}


function beregnMarkeredeFelter(felter, resultater){
  const tilladt = {};
  resultater.forEach(r=>{
    tilladt[r] = (tilladt[r] || 0) + 1;
  });

  const brugt = {};
  return felter.map(f=>{
    if(tilladt[f] && (brugt[f] || 0) < tilladt[f]){
      brugt[f] = (brugt[f] || 0) + 1;
      return { værdi: f, ramt: true };
    }
    return { værdi: f, ramt: false };
  });
}

function beregnPulje(spil){
  const solgte = Object.values(spil.købere || {}).filter(k =>
    k.navn && k.navn.trim() !== ""
  ).length;

  return spil.pris * solgte * (spil.rate / 100);
}
