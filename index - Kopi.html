<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>VM Bingo Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; background:#f4f4f4; margin:10px; }
.card { background:#fff; padding:10px; margin:10px 0; border-radius:8px; }
input, select, button {
  width:100%; padding:8px; margin:4px 0; font-size:16px;
}
button { background:#007bff; color:white; border:none; border-radius:5px; }
button:hover { background:#0056b3; }
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(160px,1fr));
  gap:8px;
}
.plade {
  border:1px solid #ccc; padding:6px; border-radius:6px;
  background:#fafafa;
}
.small { font-size:13px; color:#555; }
</style>
</head>
<body>

<h1>⚽ VM Bingo</h1>

<!-- 🌍 Globale resultater -->
<div class="card">
<h2>📥 Indtast kampresultater (fælles for alle spil)</h2>
<input id="nytResultat" placeholder="Fx 2-1">
<button onclick="tilføjGlobaltResultat()">Tilføj</button>
<div id="globalResultater"></div>
</div>

<!-- ➕ Opret spil -->
<div class="card">
<h2>➕ Opret nyt spil</h2>
<input id="spilNavn" placeholder="Spil navn">
<input id="spilNr" placeholder="Spilnummer">
<input id="pris" placeholder="Pris pr. plade">
<select id="antalPlader">
  <option value="50">50 plader</option>
  <option value="100">100 plader</option>
</select>
<button onclick="opretSpil()">Opret spil</button>
</div>

<!-- 🎯 Aktive spil -->
<div class="card">
<h2>🎯 Aktive spil</h2>
<div id="aktiveSpil"></div>
</div>

<!-- 🏆 Tættest -->
<div class="card">
<h2>🏆 Tættest på fuld plade</h2>
<div id="tættest"></div>
</div>

<!-- 🎮 Spilvisning -->
<div id="spilSektion" style="display:none;">
<div class="card">
<h2 id="spilTitel"></h2>
<div class="small" id="spilInfo"></div>
<button onclick="lukSpil()">⬅️ Tilbage</button>
</div>

<div class="card">
<h3>👥 Plader</h3>
<div id="pladeGrid" class="grid"></div>
</div>
</div>

let data = JSON.parse(localStorage.getItem("vmData") || "{}");
if(!data.spil) data = { spil:{}, resultater:[] };

let aktivtSpil = null;

// ---------- Gem ----------
function gem(){
  localStorage.setItem("vmData", JSON.stringify(data));
  visAktive();
  visGlobalResultater();
  visTættest();
}

// ---------- Globale resultater ----------
function tilføjGlobaltResultat(){
  const r = nytResultat.value.trim();
  if(!r) return;
  data.resultater.push(r);
  nytResultat.value="";
  gem();
}

function visGlobalResultater(){
  globalResultater.innerHTML =
    "<b>Resultater:</b><br>" + data.resultater.join(", ");
}

// ---------- Opret spil ----------
function opretSpil(){
  const navn = spilNavn.value.trim();
  const nr = spilNr.value.trim();
  const prisVal = pris.value.trim();
  const antal = antalPlader.value;

  if(!navn || !nr || !prisVal){
    alert("Udfyld alle felter");
    return;
  }
  if(data.spil[nr]){
    alert("Spilnummer findes allerede");
    return;
  }

  data.spil[nr] = {
    navn, nr, pris: prisVal, antal,
    plader: antal=="50" ? JSON_50 : JSON_100,
    købere: {}
  };
  gem();
  spilNavn.value=""; spilNr.value=""; pris.value="";
}

// ---------- Aktive spil ----------
function visAktive(){
  aktiveSpil.innerHTML="";
  Object.values(data.spil).forEach(s=>{
    const d=document.createElement("div");
    d.className="card";
    d.innerHTML=`<b>${s.navn}</b><br>
      Spil #${s.nr} – ${s.antal} plader – ${s.pris} kr<br>
      <button onclick="åbnSpil('${s.nr}')">Åbn</button>`;
    aktiveSpil.appendChild(d);
  });
}

// ---------- Åbn spil ----------
function åbnSpil(nr){
  aktivtSpil = data.spil[nr];
  spilSektion.style.display="block";
  spilTitel.textContent = aktivtSpil.navn;
  spilInfo.textContent =
    `Spil #${aktivtSpil.nr} – ${aktivtSpil.antal} plader – ${aktivtSpil.pris} kr`;
  visPlader();
}

function lukSpil(){
  aktivtSpil=null;
  spilSektion.style.display="none";
}

// ---------- Plader ----------
function visPlader(){
  pladeGrid.innerHTML="";
  Object.keys(aktivtSpil.plader).forEach(nr=>{
    const k = aktivtSpil.købere[nr] || {navn:"", tlf:""};
    const div=document.createElement("div");
    div.className="plade";
    div.innerHTML=`
      <b>Plade ${nr}</b><br>
      <input placeholder="Navn" value="${k.navn}"
        onchange="gemKøber('${nr}',this.value,'navn')">
      <input placeholder="Telefon" value="${k.tlf}"
        onchange="gemKøber('${nr}',this.value,'tlf')">
    `;
    pladeGrid.appendChild(div);
  });
}

function gemKøber(nr,val,felt){
  if(!aktivtSpil.købere[nr])
    aktivtSpil.købere[nr]={navn:"",tlf:""};
  aktivtSpil.købere[nr][felt]=val;
  gem();
}

// ---------- Tættest ----------
function visTættest(){
  let alle=[];
  Object.values(data.spil).forEach(s=>{
    Object.entries(s.købere).forEach(([plade,k])=>{
      const felter = s.plader[plade];
      let unikke = [...new Set(felter)];
      let hits = unikke.filter(f => data.resultater.includes(f)).length;
      alle.push({
        spil:s.navn, plade, navn:k.navn, hits
      });
    });
  });
  alle.sort((a,b)=>b.hits-a.hits);
  tættest.innerHTML = alle.length
    ? alle.slice(0,5).map(a=>
      `${a.spil} – Plade ${a.plade} – ${a.navn} – ${a.hits}/9`
      ).join("<br>")
    : "Ingen plader tildelt endnu";
}

// Init
visGlobalResultater();
visAktive();
visTættest();
